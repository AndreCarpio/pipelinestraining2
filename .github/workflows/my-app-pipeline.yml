name: CI

on:
  # push:
  #   branches: [ "develop", "main" ]
  # pull_request:
  #   branches: [ "develop", "main" ]

  workflow_dispatch:

env:
  SEM_VERSION: ""
  IMAGE_NAME: ""

jobs:
  ## 🔧 1.
  Static-codecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  ## 🔧 2.
  Build:
    runs-on: ubuntu-latest
    needs: Static-codecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  ## 🚀 3.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: Build
    environment:
      name: Develop
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

  ## 🚀 4.
  deploy-prod:
    runs-on: ubuntu-latest
    needs: deploy-dev
    environment:
      name: Production
      url: http://localhost:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
